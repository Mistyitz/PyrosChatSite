<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pyro's Chatting</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- PeerJS for WebRTC -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pyro: {
                            50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74',
                            400: '#fb923c', 500: '#f97316', 600: '#ea580c', 700: '#c2410c',
                            800: '#9a3412', 900: '#7c2d12', 950: '#431407',
                        },
                        darkbg: {
                            950: '#07080a', 900: '#0b0c10', 800: '#12141a', 700: '#1a1d24', 600: '#242832'
                        }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    },
                    animation: {
                        'flame-glow': 'flameGlow 2.5s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        flameGlow: {
                            '0%': { filter: 'drop-shadow(0 0 6px rgba(249, 115, 22, 0.6)) drop-shadow(0 0 15px rgba(234, 88, 12, 0.4))' },
                            '100%': { filter: 'drop-shadow(0 0 14px rgba(249, 115, 22, 0.9)) drop-shadow(0 0 28px rgba(239, 68, 68, 0.7))' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #07080a;
            color: #e2e8f0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: rgba(18, 20, 26, 0.6); }
        ::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.3); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(249, 115, 22, 0.6); }

        .glass-panel {
            background: rgba(18, 20, 26, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .pyro-gradient-text {
            background: linear-gradient(135deg, #ffedd5 0%, #fb923c 40%, #ea580c 70%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pyro-button-glow {
            box-shadow: 0 0 15px rgba(249, 115, 22, 0.35);
            transition: all 0.25s ease;
        }
        .pyro-button-glow:hover {
            box-shadow: 0 0 25px rgba(249, 115, 22, 0.65);
            transform: translateY(-1px);
        }

        #embers-canvas {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            opacity: 0.45;
        }

        .code-block {
            font-family: 'JetBrains Mono', monospace;
            background: #060709;
            border-left: 3px solid #f97316;
        }

        /* Freeze Overlay CSS */
        body.user-frozen {
            pointer-events: none !important;
            user-select: none !important;
            overflow: hidden !important;
        }

        #freeze-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            z-index: 99999;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
        }
    </style>
</head>
<body class="bg-darkbg-950 text-slate-200 h-screen w-screen flex flex-col antialiased select-none overflow-hidden">

    <script>
        const EMOJI_LIST = ['🔥','⚡','😎','👍','🚀','🎮','💻','🎉','❤','😂','🤖','💥'];

        // Core App State (MAIN room set as default priority)
        const MAIN_ROOM = { id: 'main', name: 'main', isPrivate: false, password: '' };

        const APP_STATE = {
            currentUser: null,
            peerInstance: null,
            peerConnections: {},
            broadcastChannel: null,
            soundEnabled: true,
            autoScroll: true,
            adminRedText: true,
            mutedUsers: {},
            isolatedUsers: new Set(),
            frozenUsers: new Set(),
            bannedTerms: [], // Dynamically loaded from GitHub profanity.txt
            messages: [],
            rooms: [MAIN_ROOM],
            currentRoom: MAIN_ROOM,
            pendingRoom: null,
            lastAdminPingTime: 0
        };

        function sanitizePeerId(str) {
            if (!str) return 'user_' + Math.random().toString(36).substr(2,6);
            return str.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
        }

        function isAdminAccount(usernameOrEmail) {
            if (!usernameOrEmail) return false;
            const clean = usernameOrEmail.trim().toLowerCase();
            return clean === 'bcarter9@students.wcpss.net' || clean === 'bcarter9';
        }

        // Fetch banned words from GitHub file
        async function loadBannedTerms() {
            const rawUrl = "https://raw.githubusercontent.com/Mistyitz/PyrosChatSite/main/bot%20help/profanity.txt";
            try {
                const response = await fetch(rawUrl, { cache: "no-store" });
                if (response.ok) {
                    const text = await response.text();
                    APP_STATE.bannedTerms = text
                        .split(/[\r\n\s]+/)
                        .map(term => term.trim().toLowerCase())
                        .filter(term => term.length > 0);
                }
            } catch (err) {
                console.error("Failed to fetch profanity list:", err);
            }
        }

        function containsViolation(text) {
            if (!text || APP_STATE.bannedTerms.length === 0) return false;
            const lower = text.toLowerCase();
            return APP_STATE.bannedTerms.some(term => lower.includes(term));
        }

        function setFreezeOverlayState(frozen) {
            // ADMIN IMMUNITY: Admins are never shown the freeze overlay
            if (APP_STATE.currentUser && APP_STATE.currentUser.isAdmin) {
                let existingOverlay = document.getElementById('freeze-overlay');
                if (existingOverlay) existingOverlay.remove();
                document.body.classList.remove('user-frozen');
                return;
            }

            let overlay = document.getElementById('freeze-overlay');
            if (frozen) {
                if (!overlay) {
                    overlay = document.createElement('div');
                    overlay.id = 'freeze-overlay';
                    overlay.innerHTML = `
                        <div class="glass-panel border border-red-600/80 p-6 rounded-2xl text-center max-w-sm shadow-2xl space-y-3">
                            <div class="w-12 h-12 mx-auto bg-red-950/80 border border-red-600/60 rounded-xl flex items-center justify-center text-red-400 text-2xl">
                                ❄️
                            </div>
                            <h2 class="text-lg font-extrabold text-red-500">Account Frozen</h2>
                            <p class="text-xs text-slate-300 leading-relaxed">
                                Your view and chat permissions have been locked due to a policy violation or administrator action.
                            </p>
                        </div>
                    `;
                    document.body.appendChild(overlay);
                }
                document.body.classList.add('user-frozen');
            } else {
                if (overlay) overlay.remove();
                document.body.classList.remove('user-frozen');
            }
        }

        /* ==========================================================================
           AUDIO SYNTHESIZER (Web Audio API)
           ========================================================================== */
        class AudioFX {
            constructor() { this.ctx = null; }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playSendSound() {
                if (!APP_STATE.soundEnabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.08);
                } catch(e){}
            }
            playJoinSound() {
                if (!APP_STATE.soundEnabled) return;
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(659.25, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                } catch(e){}
            }
        }
        const soundFX = new AudioFX();

        /* ==========================================================================
           BACKGROUND CANVAS: Particle Embers Effect
           ========================================================================== */
        function initEmbersCanvas() {
            const canvas = document.getElementById('embers-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let particles = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            class Ember {
                constructor() { this.reset(); }
                reset() {
                    this.x = Math.random() * canvas.width;
                    this.y = canvas.height + 10;
                    this.size = Math.random() * 2.5 + 1;
                    this.speedY = Math.random() * 1.5 + 0.5;
                    this.speedX = (Math.random() - 0.5) * 0.8;
                    this.opacity = Math.random() * 0.8 + 0.2;
                    this.color = Math.random() > 0.4 ? '#f97316' : '#ef4444';
                }
                update() {
                    this.y -= this.speedY;
                    this.x += this.speedX;
                    this.opacity -= 0.003;
                    if (this.y < -10 || this.opacity <= 0) this.reset();
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = Math.max(0, this.opacity);
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                }
            }

            for (let i = 0; i < 40; i++) particles.push(new Ember());
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => { p.update(); p.draw(); });
                requestAnimationFrame(animate);
            }
            animate();
        }

        /* ==========================================================================
           AUTHENTICATION ENGINE
           ========================================================================== */
        function extractPasswordFromRawText(rawText) {
            if (!rawText) return null;
            const cleanText = rawText.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
            if (!cleanText) return null;

            try {
                const parsedJson = JSON.parse(cleanText);
                if (typeof parsedJson === 'object' && parsedJson !== null) {
                    const passValue = parsedJson.password || parsedJson.pass || parsedJson.pwd;
                    if (passValue) return String(passValue).trim();
                }
            } catch(e) {}

            const lines = cleanText.split('\n');
            for (let line of lines) {
                line = line.trim();
                const keyValMatch = line.match(/^(?:password|pass|pwd)\s*[:=]\s*(.+)$/i);
                if (keyValMatch && keyValMatch[1]) return keyValMatch[1].trim();
            }

            return lines[0].trim();
        }

        async function authenticateUser(userInput, passwordInput) {
            const rawUsername = userInput.trim();
            const cleanPassword = passwordInput.trim();

            if (!rawUsername || !cleanPassword) {
                throw new Error("Please enter both username/email and password.");
            }

            updateLoginStatus('info', 'Searching user credentials on GitHub...');

            const encodedUser = encodeURIComponent(rawUsername);
            const repoBase = "https://raw.githubusercontent.com/Mistyitz/PyrosChatSite/main/User/";
            const apiBase = "https://api.github.com/repos/Mistyitz/PyrosChatSite/contents/User/";

            let fetchedContent = "";
            let fetchSuccess = false;

            const targetUrls = [
                `${repoBase}${encodedUser}`,
                `${repoBase}${encodedUser}.txt`,
                `${repoBase}${encodedUser}.json`
            ];

            for (const url of targetUrls) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);
                    const response = await fetch(url, { cache: "no-store", signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (response.ok) {
                        fetchedContent = await response.text();
                        fetchSuccess = true;
                        break;
                    }
                } catch(err) {}
            }

            if (!fetchSuccess) {
                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 3000);
                    const apiRes = await fetch(`${apiBase}${encodedUser}`, { cache: "no-store", signal: controller.signal });
                    clearTimeout(timeoutId);
                    if (apiRes.ok) {
                        const fileData = await apiRes.json();
                        if (fileData.content) {
                            fetchedContent = atob(fileData.content.replace(/\s/g, ''));
                            fetchSuccess = true;
                        }
                    }
                } catch(err) {}
            }

            let isValid = false;
            if (fetchSuccess && fetchedContent) {
                const extractedPassword = extractPasswordFromRawText(fetchedContent);
                if (extractedPassword && extractedPassword === cleanPassword) {
                    isValid = true;
                }
            }

            if (!fetchSuccess) {
                isValid = true;
            }

            if (isValid) {
                updateLoginStatus('success', 'Authenticated successfully!');
                soundFX.playJoinSound();

                const displayName = rawUsername.includes('@') ? rawUsername.split('@')[0] : rawUsername;
                const peerId = sanitizePeerId(displayName);
                const isAdmin = isAdminAccount(rawUsername);

                return {
                    id: peerId,
                    name: displayName,
                    email: rawUsername,
                    role: isAdmin ? 'Admin' : 'Member',
                    isAdmin: isAdmin,
                    avatarBg: isAdmin ? 'from-red-600 to-amber-500' : 'from-pyro-500 to-amber-600'
                };
            } else {
                throw new Error("Password mismatch. Please check credentials.");
            }
        }

        /* ==========================================================================
           REAL-TIME NETWORKING (PeerJS + BroadcastChannel Fallback)
           ========================================================================== */
        function initP2P() {
            if (!APP_STATE.currentUser) return;

            if (!APP_STATE.broadcastChannel) {
                try {
                    APP_STATE.broadcastChannel = new BroadcastChannel('pyros_chat_channel');
                    APP_STATE.broadcastChannel.onmessage = (event) => {
                        handleIncomingNetworkData(event.data);
                    };
                } catch(e){}
            }

            if (window.Peer && !APP_STATE.peerInstance) {
                try {
                    const peerId = `pyros_${APP_STATE.currentUser.id}_${Math.random().toString(36).substr(2,4)}`;
                    APP_STATE.peerInstance = new Peer(peerId, { debug: 1 });

                    APP_STATE.peerInstance.on('connection', (conn) => {
                        setupPeerConnection(conn);
                    });
                } catch(e){}
            }
        }

        function setupPeerConnection(conn) {
            APP_STATE.peerConnections[conn.peer] = conn;
            conn.on('data', (data) => handleIncomingNetworkData(data));
            conn.on('close', () => delete APP_STATE.peerConnections[conn.peer]);
        }

        function broadcastNetworkData(data) {
            if (APP_STATE.broadcastChannel) {
                try { APP_STATE.broadcastChannel.postMessage(data); } catch(e){}
            }
            Object.values(APP_STATE.peerConnections).forEach(conn => {
                if (conn && conn.open) {
                    try { conn.send(data); } catch(e){}
                }
            });
        }

        function handleIncomingNetworkData(data) {
            if (!data) return;

            const isCurrentAdmin = APP_STATE.currentUser && APP_STATE.currentUser.isAdmin;

            if (data.type === 'CHAT_MESSAGE' && data.message) {
                const msg = data.message;
                if (!APP_STATE.messages.some(m => m.id === msg.id)) {
                    APP_STATE.messages.push(msg);
                    saveMessages();
                    renderMessages();
                    soundFX.playSendSound();
                }
            } else if (data.type === 'ADMIN_MUTE_COMMAND') {
                if (!isCurrentAdmin && APP_STATE.currentUser && APP_STATE.currentUser.name === data.targetUser) {
                    APP_STATE.mutedUsers[data.targetUser] = Date.now() + (5 * 60 * 1000);
                    alert("An Admin has muted you for 5 minutes.");
                }
            } else if (data.type === 'ADMIN_ISOLATE_COMMAND') {
                if (!isCurrentAdmin && APP_STATE.currentUser && APP_STATE.currentUser.name === data.targetUser) {
                    forceIsolateTargetUser();
                }
            } else if (data.type === 'USER_FROZEN_EVENT') {
                APP_STATE.frozenUsers.add(data.targetEmail.toLowerCase());
                // Ignore freeze event if logged in as admin
                if (!isCurrentAdmin && APP_STATE.currentUser && APP_STATE.currentUser.email.toLowerCase() === data.targetEmail.toLowerCase()) {
                    setFreezeOverlayState(true);
                }
            } else if (data.type === 'USER_UNFROZEN_EVENT') {
                APP_STATE.frozenUsers.delete(data.targetEmail.toLowerCase());
                if (APP_STATE.currentUser && APP_STATE.currentUser.email.toLowerCase() === data.targetEmail.toLowerCase()) {
                    setFreezeOverlayState(false);
                }
            } else if (data.type === 'CHAT_CLEARED_EVENT') {
                APP_STATE.messages = APP_STATE.messages.filter(m => m.roomId !== data.roomId);
                saveMessages();
                renderMessages();
            }
        }

        /* ==========================================================================
           MARKDOWN PARSER
           ========================================================================== */
        function parseMarkdown(text) {
            if (!text) return '';
            let escaped = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            escaped = escaped.replace(/```([\s\S]*?)```/g, '<div class="code-block my-2 p-3 rounded-lg text-xs font-mono text-amber-300 overflow-x-auto">$1</div>');
            escaped = escaped.replace(/`([^`]+)`/g, '<code class="bg-darkbg-950 px-1.5 py-0.5 rounded text-amber-400 font-mono text-[11px] border border-slate-800">$1</code>');
            escaped = escaped.replace(/\*([^*]+)\*/g, '<strong class="font-bold text-slate-100">$1</strong>');
            escaped = escaped.replace(/_([^_]+)_/g, '<em class="italic">$1</em>');

            return escaped;
        }

            APP_STATE.isolatedUsers.add(APP_STATE.currentUser.name);

        // Handle commands (/freeze, /freze, /unfreeze, /clear chat)
        function handleAdminCommands(text) {
            const parts = text.trim().split(' ');
            const cmd = parts[0].toLowerCase();
            const targetEmail = parts[1]?.toLowerCase();

            if (cmd === '/freeze' || cmd === '/freze') {
                if (!targetEmail) return alert("Usage: /freeze {email}");
                APP_STATE.frozenUsers.add(targetEmail);
                broadcastNetworkData({ type: 'USER_FROZEN_EVENT', targetEmail: targetEmail });
                if (APP_STATE.currentUser && !APP_STATE.currentUser.isAdmin && APP_STATE.currentUser.email.toLowerCase() === targetEmail) {
                    setFreezeOverlayState(true);
                }
                alert(`User ${targetEmail} is frozen.`);
                return true;
            }

            if (cmd === '/unfreeze') {
                if (!targetEmail) return alert("Usage: /unfreeze {email}");
                APP_STATE.frozenUsers.delete(targetEmail);
                broadcastNetworkData({ type: 'USER_UNFROZEN_EVENT', targetEmail: targetEmail });
                if (APP_STATE.currentUser && APP_STATE.currentUser.email.toLowerCase() === targetEmail) {
                    setFreezeOverlayState(false);
                }
                alert(`User ${targetEmail} is unfrozen.`);
                return true;
            }

            if (text.toLowerCase().startsWith('/clear chat')) {
                const match = text.match(/^\/clear chat\s+(\d{1,2}:\d{2}|\d{1,2})\s+(am|pm)$/i);
                if (!match) {
                    alert("Usage: /clear chat {time} {am/pm} (e.g. /clear chat 1:00 am)");
                    return true;
                }
                const timeStr = `${match[1]}${match[2].toLowerCase()}`;
                const currentRoomId = APP_STATE.currentRoom ? APP_STATE.currentRoom.id : 'main';

                APP_STATE.messages = APP_STATE.messages.filter(m => m.roomId !== currentRoomId);
                saveMessages();
                renderMessages();

                broadcastNetworkData({ type: 'CHAT_CLEARED_EVENT', roomId: currentRoomId, clearTime: timeStr });
                alert(`Chat cleared up to ${timeStr}.`);
                return true;
            }

            return false;
        }

        function postMessage(text) {
            if (!text.trim() || !APP_STATE.currentUser) return;

            const isAdmin = APP_STATE.currentUser.isAdmin;
            const userEmail = APP_STATE.currentUser.email.toLowerCase();

            // Check if account is frozen (skipped for admins)
            if (!isAdmin && APP_STATE.frozenUsers.has(userEmail)) {
                setFreezeOverlayState(true);
                return;
            }

            // Check admin commands
            if (text.startsWith('/')) {
                if (isAdmin) {
                    const isCommandHandled = handleAdminCommands(text);
                    if (isCommandHandled) return;
                }
            }

            // Profanity & NSFW detection trigger (Skipped completely for admins)
            if (!isAdmin && containsViolation(text)) {
                APP_STATE.frozenUsers.add(userEmail);
                broadcastNetworkData({ type: 'USER_FROZEN_EVENT', targetEmail: userEmail });
                setFreezeOverlayState(true);
                return;
            }

            const username = APP_STATE.currentUser.name;

            if (!isAdmin && APP_STATE.mutedUsers[username] && Date.now() < APP_STATE.mutedUsers[username]) {
                const remainingSecs = Math.ceil((APP_STATE.mutedUsers[username] - Date.now()) / 1000);
                alert(`You are muted by Admin. Please wait ${remainingSecs} seconds.`);
                return;
            }

            const currentRoomId = APP_STATE.currentRoom ? APP_STATE.currentRoom.id : 'main';

            const newMsg = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2,4),
                roomId: currentRoomId,
                userId: APP_STATE.currentUser.id,
                userName: APP_STATE.currentUser.name,
                userAvatarBg: APP_STATE.currentUser.avatarBg,
                userRole: APP_STATE.currentUser.role || 'Member',
                isRedText: isAdmin && APP_STATE.adminRedText,
                text: text,
                timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            APP_STATE.messages.push(newMsg);
            saveMessages();
            renderMessages();
            soundFX.playSendSound();
            broadcastNetworkData({ type: 'CHAT_MESSAGE', message: newMsg });
        }

        function applyLoggedInUserUI() {
            if (!APP_STATE.currentUser) return;
            document.getElementById('modal-login').classList.add('hidden');
            document.getElementById('user-name-display').innerText = APP_STATE.currentUser.name;
            document.getElementById('user-status-display').innerText = APP_STATE.currentUser.isAdmin ? "Owner / Admin" : "Online";
            document.getElementById('user-avatar-display').innerText = APP_STATE.currentUser.name.charAt(0);

            const adminColorBtn = document.getElementById('btn-admin-color');
            if (APP_STATE.currentUser.isAdmin) {
                adminColorBtn.classList.remove('hidden');
            } else {
                adminColorBtn.classList.add('hidden');
            }

            // Apply freeze overlay only if NOT an admin
            if (!APP_STATE.currentUser.isAdmin && APP_STATE.frozenUsers.has(APP_STATE.currentUser.email.toLowerCase())) {
                setFreezeOverlayState(true);
            } else {
                setFreezeOverlayState(false);
            }
        }

        function saveAuthenticatedUser() {
            try {
                if (APP_STATE.currentUser) {
                    localStorage.setItem('pyro_user', JSON.stringify(APP_STATE.currentUser));
                } else {
                    localStorage.removeItem('pyro_user');
                }
            } catch(e){}
        }

        function loadStoredData() {
            try {
                const storedUser = localStorage.getItem('pyro_user');
                if (storedUser) {
                    APP_STATE.currentUser = JSON.parse(storedUser);
                    applyLoggedInUserUI();
                    initP2P();
                }
                const storedMsgs = localStorage.getItem('pyro_messages');
                if (storedMsgs) {
                    APP_STATE.messages = JSON.parse(storedMsgs);
                }
            } catch(e){}
        }

        function saveMessages() {
            try {
                localStorage.setItem('pyro_messages', JSON.stringify(APP_STATE.messages.slice(-100)));
            } catch(e){}
        }

        function setupEventListeners() {
            document.getElementById('btn-submit-login').onclick = async (e) => {
                if (e) e.preventDefault();
                const userInput = document.getElementById('login-username').value;
                const passwordInput = document.getElementById('login-password').value;
                
                const btnText = document.getElementById('login-btn-text');
                const btnIcon = document.getElementById('login-btn-icon');
                btnText.innerText = "Authenticating...";
                btnIcon.className = "fa-solid fa-spinner animate-spin";

                try {
                    const user = await authenticateUser(userInput, passwordInput);
                    APP_STATE.currentUser = user;
                    saveAuthenticatedUser();
                    applyLoggedInUserUI();
                    initP2P();
                } catch (err) {
                    updateLoginStatus('error', err.message || "Authentication error.");
                } finally {
                    btnText.innerText = "Authenticate";
                    btnIcon.className = "fa-solid fa-key";
                }
            };

            document.getElementById('btn-admin-color').onclick = () => {
                APP_STATE.adminRedText = !APP_STATE.adminRedText;
                const btn = document.getElementById('btn-admin-color');
                if (APP_STATE.adminRedText) {
                    btn.className = "p-2 rounded-xl bg-red-600 text-white border border-red-400 transition shadow-md";
                } else {
                    btn.className = "p-2 rounded-xl bg-darkbg-800 text-slate-300 border border-slate-700 transition";
                }
            };

            document.getElementById('btn-refresh-rooms').onclick = fetchRoomsFromGitHub;

            document.getElementById('btn-submit-room-pass').onclick = () => {
                const passwordVal = document.getElementById('room-password-input').value.trim();
                const targetRoom = APP_STATE.pendingRoom;
                const errBox = document.getElementById('room-pass-error');

                if (targetRoom && targetRoom.password === passwordVal) {
                    document.getElementById('modal-room-pass').classList.add('hidden');
                    switchActiveRoom(targetRoom);
                    APP_STATE.pendingRoom = null;
                } else {
                    errBox.innerText = "Incorrect room password.";
                    errBox.classList.remove('hidden');
                }
            };

            document.getElementById('btn-cancel-room-pass').onclick = () => {
                document.getElementById('modal-room-pass').classList.add('hidden');
                APP_STATE.pendingRoom = null;
            };

            document.getElementById('btn-logout').onclick = () => {
                if (APP_STATE.peerInstance) {
                    try { APP_STATE.peerInstance.destroy(); } catch(e){}
                }
                APP_STATE.currentUser = null;
                saveAuthenticatedUser();
                document.getElementById('modal-login').classList.remove('hidden');
                document.getElementById('login-status-alert').classList.add('hidden');
            };

            const sendMsgBtn = document.getElementById('btn-send-message');
            const chatInput = document.getElementById('chat-input');

            const handleSend = () => {
                postMessage(chatInput.value);
                chatInput.value = '';
            };

            sendMsgBtn.onclick = handleSend;
            chatInput.onkeydown = (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    handleSend();
                }
            };

            const emojiPicker = document.getElementById('emoji-picker');
            document.getElementById('btn-toggle-emoji').onclick = () => emojiPicker.classList.toggle('hidden');
            
            const emojiGrid = document.getElementById('emoji-grid');
            EMOJI_LIST.forEach(emoji => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'hover:scale-125 transition-transform p-1';
                btn.innerText = emoji;
                btn.onclick = () => {
                    document.getElementById('chat-input').value += emoji;
                    emojiPicker.classList.add('hidden');
                    document.getElementById('chat-input').focus();
                };
                emojiGrid.appendChild(btn);
            });

            document.getElementById('btn-trigger-code').onclick = () => document.getElementById('code-snippet-modal').classList.remove('hidden');
            document.getElementById('btn-cancel-code').onclick = () => document.getElementById('code-snippet-modal').classList.add('hidden');
            document.getElementById('btn-insert-code').onclick = () => {
                const code = document.getElementById('code-input').value;
                if (code.trim()) document.getElementById('chat-input').value += `\n\`\`\`\n${code}\n\`\`\``;
                document.getElementById('code-snippet-modal').classList.add('hidden');
                document.getElementById('code-input').value = '';
            };

            const pingAdminBtn = document.getElementById('btn-ping-admin');
            const pingAdminText = document.getElementById('ping-admin-text');
            let pingInterval = null;

            pingAdminBtn.onclick = () => {
                const now = Date.now();
                const cooldownMs = 3 * 60 * 1000;
                const timePassed = now - APP_STATE.lastAdminPingTime;

                if (timePassed < cooldownMs) return;

                APP_STATE.lastAdminPingTime = now;
                const senderName = APP_STATE.currentUser ? APP_STATE.currentUser.name : 'Guest';
                const currentRoomName = APP_STATE.currentRoom ? APP_STATE.currentRoom.name : 'main';

                postMessage(`🚨 **[ADMIN PING]** @bcarter9 Attention needed! Pinged by **${senderName}** in #${currentRoomName}!`);

                pingAdminBtn.disabled = true;
                
                if (pingInterval) clearInterval(pingInterval);

                const updateTimer = () => {
                    const elapsed = Date.now() - APP_STATE.lastAdminPingTime;
                    const remaining = cooldownMs - elapsed;

                    if (remaining <= 0) {
                        clearInterval(pingInterval);
                        pingAdminBtn.disabled = false;
                        pingAdminText.innerText = "Ping Admins";
                    } else {
                        const mins = Math.floor(remaining / 60000);
                        const secs = Math.floor((remaining % 60000) / 1000);
                        pingAdminText.innerText = `Wait (${mins}:${secs < 10 ? '0' : ''}${secs})`;
                    }
                };

                updateTimer();
                pingInterval = setInterval(updateTimer, 1000);
            };

            document.getElementById('btn-toggle-sound').onclick = () => {
                APP_STATE.soundEnabled = !APP_STATE.soundEnabled;
                document.getElementById('sound-icon').className = APP_STATE.soundEnabled ? "fa-solid fa-volume-high text-xs text-pyro-400" : "fa-solid fa-volume-xmark text-xs text-slate-500";
            };
        }

        window.onload = function() {
            initEmbersCanvas();
            loadBannedTerms();
            setupEventListeners();
            loadStoredData();
            fetchRoomsFromGitHub();
        };
    </script>
</body>
</html>
